<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reverse Eliminator</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="topbar">
  <div class="brand-block">
    <div class="brand-title">Reverse Eliminator</div>
    <div class="brand-sub">Pick a team to <span class="lose-word">LOSE</span> each week</div>
  </div>
  <div id="accountBox" class="account-box"></div>
</header>

<nav class="tabs" id="mainTabs">
  <button class="tab-btn active" data-view="home">Home</button>
  <button class="tab-btn" data-view="entries">My Entry</button>
  <button class="tab-btn" data-view="standings">Standings</button>
</nav>

<main id="app">
  <div id="weekTabs" class="week-tabs"></div>
  <div id="content" class="content"></div>
</main>

<div id="toast" class="toast hidden"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/espn.js"></script>
<script src="js/app.js"></script>
</body>
</html>
